# Add inside the HTTPS server block for onecurrency.net.
# This is a deployment template, not an installed configuration.
location ^~ /api/funding/ {
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:3101;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    # OVERWRITE the incoming header. If behind a CDN, configure nginx real_ip
    # using only the CDN's trusted address ranges before relying on remote_addr.
    proxy_set_header True-Client-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
    proxy_buffering off;
}
