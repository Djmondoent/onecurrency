name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Production dependency audit (must be clean)
        run: npm audit --omit=dev
      - name: Transaction regression checks
        run: node tests/transaction-audit.cjs
      - name: Production web build
        run: npm run build:web
