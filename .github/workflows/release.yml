name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies (gate)
        run: npm audit --omit=dev

      - name: Transaction audit checks
        run: node tests/transaction-audit.cjs

      - name: Build web app
        run: npm run build:web

      - name: Package web build
        run: zip -r onecurrency-web-${{ github.ref_name }}.zip dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: onecurrency-web-${{ github.ref_name }}.zip

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: onecurrency-web-${{ github.ref_name }}.zip
          generate_release_notes: true
